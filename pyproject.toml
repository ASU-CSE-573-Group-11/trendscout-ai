[project]
name = "trendscout-ai"
version = "0.1.0"
description = "TrendScout AI, CSE 573 Group 11"
requires-python = ">=3.9"
dependencies = [
  "feedparser>=6.0.11",
  "jsonschema[format]>=4.18.0",
  "requests>=2.31.0",
  "rdflib>=7.0.0",
  "pyshacl>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
